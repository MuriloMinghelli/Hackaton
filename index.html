<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOVA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&display=swap">
<style>
  :root{
    --bg:#150A28;
    --ink:#F4EEF7;
    --accent:#C23A57;
    --font-display:'Unbounded','Arial Black',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    overflow:hidden;
  }

  h1.wordmark{
    margin:0; color:var(--accent); font-family:var(--font-display); font-weight:800;
    display:grid; grid-template-columns:repeat(2,max-content); justify-content:center;
    line-height:0.84; letter-spacing:-0.02em;
  }
  .wordmark .ltr{
    font-size:clamp(64px,17vw,180px);
    display:inline-block;
  }
  .wordmark .ltr:nth-child(3),
  .wordmark .ltr:nth-child(4){margin-top:-0.1em;}
  .wordmark .rest{
    font-size:clamp(64px,17vw,180px);
    color:var(--ink);
    font-weight:700;
    opacity:0;
    transform:translateX(-10px);
    transition:opacity .5s ease .5s, transform .5s ease .5s;
    grid-column:1 / -1;
    text-transform:lowercase;
    display:none;
  }
  body.phase-hero .wordmark{
    display:flex; flex-wrap:wrap; align-items:baseline; justify-content:center;
  }
  body.phase-hero .wordmark .ltr{
    font-size:clamp(40px,9vw,96px); margin-top:0; letter-spacing:-0.01em;
  }
  body.phase-hero .wordmark .rest{
    display:inline-block; font-size:clamp(40px,9vw,96px); margin-left:0.14em; order:5;
  }
  body.phase-hero.revealed .wordmark .rest{opacity:1; transform:translateX(0);}
  body.phase-hero .l-v{order:1;}
  body.phase-hero .l-a{order:2;}
  body.phase-hero .l-m{order:3;}
  body.phase-hero .l-o{order:4;}

  @media (prefers-reduced-motion: reduce){
    .wordmark .rest{transition:none !important;}
  }
</style>
</head>
<body>
  <h1 class="wordmark" id="wordmark">
    <span class="ltr l-m">M</span><span class="ltr l-o" data-final="o">O</span><span class="ltr l-v">V</span><span class="ltr l-a" data-final="a">A</span><span class="rest">&nbsp;aonde?</span>
  </h1>

  <script>
    (function(){
      var body = document.body;
      var letters = Array.prototype.slice.call(document.querySelectorAll('.wordmark .ltr'));
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function applyFinal(el){
        var f = el.getAttribute('data-final');
        if (f) el.textContent = f;
      }

      function morph(){
        var first = letters.map(function(el){ return el.getBoundingClientRect(); });
        body.classList.add('phase-hero');
        letters.forEach(applyFinal);
        var last = letters.map(function(el){ return el.getBoundingClientRect(); });
        letters.forEach(function(el, i){
          var f = first[i], l = last[i];
          var dx = f.left - l.left, dy = f.top - l.top;
          var sx = f.width / l.width, sy = f.height / l.height;
          el.style.transformOrigin = 'top left';
          el.style.transition = 'none';
          el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + sx + ',' + sy + ')';
        });
        void body.offsetHeight;
        letters.forEach(function(el){
          el.style.transition = 'transform .75s cubic-bezier(.16,.9,.28,1)';
          el.style.transform = 'translate(0,0) scale(1,1)';
        });
        body.classList.add('revealed');
      }

      if (reduced){
        body.classList.add('phase-hero', 'revealed');
        letters.forEach(applyFinal);
      } else {
        setTimeout(morph, 900);
      }
    })();
  </script>
</body>
</html>
